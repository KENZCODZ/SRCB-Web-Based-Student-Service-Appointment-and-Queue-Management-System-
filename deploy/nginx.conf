# =====================================================================
# Nginx Virtual Host Configuration for EduQueue (Ubuntu Server)
# Place in: /etc/nginx/sites-available/eduqueue.conf
# Enable: ln -s /etc/nginx/sites-available/eduqueue.conf /etc/nginx/sites-enabled/
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your server domain or public IP

    # Application Web Root
    root /var/www/eduqueue/frontend/dist;
    index index.html index.htm;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # 1. FRONTEND: React Single Page Application (SPA) Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # 2. BACKEND: PHP REST API Endpoint Routing
    location /api {
        root /var/www/eduqueue/backend/public;
        
        # Rewrite /api/... to /index.php
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            # PHP-FPM Socket (Ubuntu 22.04 / 24.04 standard socket)
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/eduqueue/backend/public/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 60;
        }
    }

    # Protect internal storage and hidden dot files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(backend/storage|backend/src|backend/config) {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/eduqueue_access.log;
    error_log /var/log/nginx/eduqueue_error.log;
}
